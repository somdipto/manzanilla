name: Verify Orange
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:
jobs:
  cloud:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: npm ci
      - run: npm run check:reception
      # cloud/web.py serves these committed bundles; a stale one would ship broken.
      - run: npm run check:web
      - run: node --test tests/*.test.cjs
      - run: pip install -r requirements-dev.txt
      - run: pip install -r voice-worker/requirements.txt
      - run: python -m pytest tests -q
      - run: pip install -r requirements-browser.txt
      - run: python -m playwright install --with-deps chromium
      - run: python tests/run_reception_browser.py
  release-policy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest tests/test_release_identity.py -q
      - name: Require increasing versions on release-impacting PR changes
        if: github.event_name == 'pull_request'
        env:
          POLICY_BASE: ${{ github.event.pull_request.base.sha }}
        run: python scripts/release_policy.py --base "$POLICY_BASE" --head HEAD
      - name: Check package identity and credential literals
        run: python scripts/release_policy_check.py

  android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '17'}
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-34 build-tools;34.0.0'
      - name: Verify personal-test ignores provider injection
        env:
          FISH_API_KEY: synthetic-env-not-a-credential
          GEMINI_API_KEY: synthetic-env-not-a-credential
        run: bash gradlew :hotel:testDebugUnitTest :hotel:lintDebug :hotel:assembleDebug :hotel:assembleDebugAndroidTest -Pdistribution=personal-test -PFISH_API_KEY=synthetic-property-not-a-credential -PGEMINI_API_KEY=synthetic-property-not-a-credential --no-daemon --max-workers=2
        working-directory: android
      - name: Enable emulator hardware acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Exercise shipped APK on Android 10 WebView
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          target: default
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: bash scripts/run-android-emulator.sh
      - name: Retain Android runtime evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-emulator-evidence
          path: |
            work/android-emulator-qa/
            work/android-update-qa/
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        with:
          name: orange-debug-apk
          path: android/hotel/build/outputs/apk/debug/*.apk
  android-hotel:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '17'}
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-34 build-tools;34.0.0'
      - name: Verify hotel ignores provider injection in its isolated job
        env:
          FISH_API_KEY: synthetic-env-not-a-credential
          GEMINI_API_KEY: synthetic-env-not-a-credential
        run: bash gradlew :hotel:testDebugUnitTest :hotel:lintDebug :hotel:assembleDebug :hotel:assembleDebugAndroidTest -Pdistribution=hotel -PFISH_API_KEY=synthetic-property-not-a-credential -PGEMINI_API_KEY=synthetic-property-not-a-credential --no-daemon
        working-directory: android
      - name: Enable emulator hardware acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Exercise protected hotel setup on a fresh disposable AVD
        uses: reactivecircus/android-emulator-runner@v2
        env:
          ANDROID_QA_DISTRIBUTION: hotel
        with:
          api-level: 29
          target: default
          arch: x86_64
          avd-name: hotel-api29
          profile: pixel_2
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: bash scripts/run-android-emulator.sh
      - name: Retain bounded hotel runtime evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-hotel-emulator-evidence
          path: work/android-emulator-qa/
          if-no-files-found: ignore
  installer-capabilities:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        api: [26, 29, 32, 34]
    env:
      FISH_API_KEY: ""
      FISH_VOICE_ID: ""
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '17'}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-34 build-tools;34.0.0'
      - name: Build isolated key-free callback and consent inputs
        shell: bash
        run: |
          set -euo pipefail
          if [[ '${{ matrix.api }}' == 34 ]]; then
            # This job's generated debug signer is disposable, never the release key.
            printf '99.0.0\n' > android/VERSION
            printf '9900\n' > android/VERSION_CODE
          fi
          bash android/gradlew -p android :hotel:assembleDebug :hotel:assembleDebugAndroidTest -Pdistribution=personal-test -PinstallerConsentFixture --no-daemon --max-workers=2
          if [[ '${{ matrix.api }}' == 34 ]]; then
            mkdir -p "$RUNNER_TEMP/updater-qa"
            cp android/hotel/build/outputs/apk/debug/hotel-debug.apk "$RUNNER_TEMP/updater-qa/baseline.apk"
            cp android/hotel/build/outputs/apk/androidTest/debug/hotel-debug-androidTest.apk "$RUNNER_TEMP/updater-qa/fixture.apk"
            printf '99.0.1\n' > android/VERSION
            printf '9901\n' > android/VERSION_CODE
            bash android/gradlew -p android :hotel:assembleDebug -Pdistribution=personal-test -PinstallerConsentFixture --no-daemon --max-workers=2
            cp android/hotel/build/outputs/apk/debug/hotel-debug.apk "$RUNNER_TEMP/updater-qa/candidate.apk"
            printf 'QA_BASE_APK=%s/updater-qa/baseline.apk\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
            printf 'QA_TEST_APK=%s/updater-qa/fixture.apk\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
            printf 'QA_CANDIDATE_APK=%s/updater-qa/candidate.apk\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
          fi
      - name: Enable emulator hardware acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Exercise shell forgeries and trusted installer ownership
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          target: google_apis
          arch: x86_64
          avd-name: installer-api${{ matrix.api }}
          profile: pixel_2
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: bash scripts/run-updater-emulator.sh
      - name: Retain bounded installer and genuine-consent evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: installer-capabilities-api${{ matrix.api }}
          path: work/android-update-qa/
          if-no-files-found: ignore
  edge:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest tests/test_platform.py -k edge_allowlist -q
