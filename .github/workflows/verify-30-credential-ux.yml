name: Verify 30 credential UX (emulator)
on:
  workflow_dispatch:
  push:
    branches: [test/fish-diagnostics]
    paths:
      - '.github/workflows/verify-30-credential-ux.yml'
      - 'scripts/verify-30-credential-ux.sh'
permissions:
  contents: read
concurrency:
  group: verify-30-credential-ux
jobs:
  ux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: test/fish-diagnostics
          path: fixture-tools
      - uses: android-actions/setup-android@v3
      - name: Download the released 17.0.30 APK from the CDN feed and verify its hash
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL https://github.com/somdipto/manzanilla/releases/latest/download/release-metadata.json -o "$RUNNER_TEMP/feed.json"
          url="$(jq -r .url "$RUNNER_TEMP/feed.json")"
          sha="$(jq -r .sha256 "$RUNNER_TEMP/feed.json")"
          ver="$(jq -r .version_name "$RUNNER_TEMP/feed.json")"
          test "$ver" = "17.0.30"
          curl -fsSL "$url" -o "$RUNNER_TEMP/release30.apk"
          echo "$sha  $RUNNER_TEMP/release30.apk" | sha256sum -c -
          cp "$RUNNER_TEMP/feed.json" feed-evidence.json
      - name: Enable emulator hardware acceleration
        run: |
          set -e
          sudo kvm-ok || true
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run the credential UX pass on a disposable emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          arch: x86_64
          profile: pixel_2
          gpu-mode: swiftshader_indirect
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          disable-animations: true
          script: bash fixture-tools/scripts/verify-30-credential-ux.sh
      - name: Retain credential UX evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: credential-ux-evidence
          path: |
            work/credential-ux/
            feed-evidence.json
          if-no-files-found: error
