name: Build verified signed APKs
on:
  workflow_dispatch: {}
  workflow_call: {}
permissions:
  contents: read
jobs:
  verify:
    uses: ./.github/workflows/verify.yml
  signed-apk:
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - distribution: personal-test
            apk: Manzanilla-Reception.apk
            metadata: release-metadata.json
          - distribution: hotel
            apk: Manzanilla-Hotel.apk
            metadata: hotel-release-metadata.json
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      RELEASE_DISTRIBUTION: ${{ matrix.distribution }}
      ORANGE_KEYSTORE: ${{ runner.temp }}/orange-pilot.jks
      ORANGE_STORE_PASSWORD: ${{ secrets.ORANGE_STORE_PASSWORD }}
      ORANGE_KEY_ALIAS: ${{ secrets.ORANGE_KEY_ALIAS }}
      ORANGE_KEY_PASSWORD: ${{ secrets.ORANGE_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '17'}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-34 build-tools;34.0.0'
      - name: Read semantic publication identity
        shell: bash
        run: |
          set -euo pipefail
          version="$(tr -d '\r\n' < android/VERSION)"
          tag="v${version}"
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            test "$GITHUB_REF_NAME" = "$tag"
          fi
          printf 'RELEASE_TAG=%s\n' "$tag" >> "$GITHUB_ENV"
          printf '%s/build-tools/34.0.0\n' "$ANDROID_HOME" >> "$GITHUB_PATH"
      - name: Prepare existing pilot signing key
        env:
          ORANGE_KEYSTORE_BASE64: ${{ secrets.ORANGE_KEYSTORE_BASE64 }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$ORANGE_KEYSTORE_BASE64"
          test -n "$ORANGE_STORE_PASSWORD"
          test -n "$ORANGE_KEY_ALIAS"
          test -n "$ORANGE_KEY_PASSWORD"
          umask 077
          printf '%s' "$ORANGE_KEYSTORE_BASE64" | base64 --decode > "$ORANGE_KEYSTORE"
      - name: Check disposable testing access and build personal-test only
        if: matrix.distribution == 'personal-test'
        env:
          FISH_API_KEY: ${{ secrets.FISH_API_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/check_fish_auth.py --distribution personal-test
          bash android/gradlew -p android :hotel:assembleRelease :hotel:assembleReleaseAndroidTest \
            -PupgradeFixture -Pdistribution=personal-test --no-daemon --max-workers=2
      - name: Build hotel without provider credentials
        if: matrix.distribution == 'hotel'
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/check_fish_auth.py --distribution hotel
          bash android/gradlew -p android :hotel:assembleRelease :hotel:assembleReleaseAndroidTest \
            -PupgradeFixture -Pdistribution=hotel --no-daemon --max-workers=2
      - name: Remove private signing material
        if: always()
        shell: bash
        run: rm -f "$ORANGE_KEYSTORE"
      - name: Collect exact candidate and private fixture
        env:
          APK_NAME: ${{ matrix.apk }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/candidate" "$RUNNER_TEMP/upgrade-fixture"
          cp android/hotel/build/outputs/apk/release/hotel-release.apk "$RUNNER_TEMP/candidate/$APK_NAME"
          cp android/hotel/build/outputs/apk/androidTest/release/hotel-release-androidTest.apk "$RUNNER_TEMP/upgrade-fixture/"
      - name: Check previous-distribution continuity and actual APK identity
        env:
          GH_TOKEN: ${{ github.token }}
          APK_NAME: ${{ matrix.apk }}
          METADATA_NAME: ${{ matrix.metadata }}
        shell: bash
        run: |
          set -euo pipefail
          python scripts/release_policy.py --download-previous "$RUNNER_TEMP/previous" \
            --github-repository "$GITHUB_REPOSITORY" --distribution "$RELEASE_DISTRIBUTION"
          previous=("$RUNNER_TEMP/previous/"*)
          test "${#previous[@]}" -eq 1
          python android/release_identity.py \
            --apk "$RUNNER_TEMP/candidate/$APK_NAME" --previous-apk "${previous[0]}" \
            --tag "$RELEASE_TAG" --distribution "$RELEASE_DISTRIBUTION" \
            --repository "$GITHUB_REPOSITORY" --output "$RUNNER_TEMP/candidate/$METADATA_NAME"
      - name: Enable emulator hardware acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Prove retained data and actual Reception on the signed candidate
        uses: reactivecircus/android-emulator-runner@v2
        env:
          ANDROID_SERIAL: emulator-5554
        with:
          api-level: 29
          target: default
          arch: x86_64
          emulator-port: 5554
          avd-name: signed-upgrade-${{ matrix.distribution }}
          profile: pixel_2
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: bash scripts/verify-signed-upgrade.sh
      - name: Retain sanitized signed upgrade evidence, including failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: signed-upgrade-${{ matrix.distribution }}-evidence
          path: work/signed-upgrade-qa/
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        with:
          name: orange-signed-${{ matrix.distribution }}-apk
          path: |
            ${{ runner.temp }}/candidate/${{ matrix.apk }}
            ${{ runner.temp }}/candidate/${{ matrix.metadata }}
          if-no-files-found: error
