name: Build signed pilot APK
on: workflow_dispatch
jobs:
  signed-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '17'}
      - uses: android-actions/setup-android@v3
      - run: sdkmanager 'platforms;android-34' 'build-tools;34.0.0'
      - name: Build with pilot signing key
        env:
          ORANGE_KEYSTORE_BASE64: ${{ secrets.ORANGE_KEYSTORE_BASE64 }}
          ORANGE_STORE_PASSWORD: ${{ secrets.ORANGE_STORE_PASSWORD }}
          ORANGE_KEY_ALIAS: ${{ secrets.ORANGE_KEY_ALIAS }}
          ORANGE_KEY_PASSWORD: ${{ secrets.ORANGE_KEY_PASSWORD }}
        working-directory: android
        run: |
          test -n "$ORANGE_KEYSTORE_BASE64"
          export ORANGE_KEYSTORE="$RUNNER_TEMP/orange-pilot.jks"
          printf '%s' "$ORANGE_KEYSTORE_BASE64" | base64 --decode > "$ORANGE_KEYSTORE"
          trap 'rm -f "$ORANGE_KEYSTORE"' EXIT
          bash gradlew :hotel:assembleRelease --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: orange-signed-pilot-apk
          path: android/hotel/build/outputs/apk/release/*.apk
