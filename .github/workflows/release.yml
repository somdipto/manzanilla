name: Build verified signed APK
on:
  workflow_dispatch: {}
  workflow_call: {}
permissions:
  contents: read
jobs:
  verify:
    uses: ./.github/workflows/verify.yml
  fish-auth:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v4
      - name: Determine whether to check Fish account access
        id: fish-check
        shell: bash
        run: |
          set -euo pipefail
          version="$(tr -d '\r\n' < android/VERSION)"
          if [[ "$version" == "17.0.37" ]]; then
            echo 'required=true' >> "$GITHUB_OUTPUT"
          else
            echo 'required=false' >> "$GITHUB_OUTPUT"
            echo 'Skipping the one-time Fish authentication check for this release.'
          fi
      - name: Verify Fish account access without creating a session
        if: steps.fish-check.outputs.required == 'true'
        env:
          FISH_API_KEY: ${{ secrets.FISH_API_KEY }}
        run: python3 scripts/check_fish_auth.py
  signed-apk:
    needs: [verify, fish-auth]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '17'}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-34 build-tools;34.0.0'
      - name: Read semantic publication identity
        shell: bash
        run: |
          set -euo pipefail
          version="$(tr -d '\r\n' < android/VERSION)"
          tag="v${version}"
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            test "$GITHUB_REF_NAME" = "$tag"
          fi
          printf 'RELEASE_TAG=%s\n' "$tag" >> "$GITHUB_ENV"
          printf '%s/build-tools/34.0.0\n' "$ANDROID_HOME" >> "$GITHUB_PATH"
      - name: Build with existing pilot signing key
        env:
          FISH_API_KEY: ${{ secrets.FISH_API_KEY }}
          ORANGE_KEYSTORE_BASE64: ${{ secrets.ORANGE_KEYSTORE_BASE64 }}
          ORANGE_STORE_PASSWORD: ${{ secrets.ORANGE_STORE_PASSWORD }}
          ORANGE_KEY_ALIAS: ${{ secrets.ORANGE_KEY_ALIAS }}
          ORANGE_KEY_PASSWORD: ${{ secrets.ORANGE_KEY_PASSWORD }}
        working-directory: android
        shell: bash
        run: |
          set -euo pipefail
          test -n "$FISH_API_KEY"
          test -n "$ORANGE_KEYSTORE_BASE64"
          export ORANGE_KEYSTORE="$RUNNER_TEMP/orange-pilot.jks"
          printf '%s' "$ORANGE_KEYSTORE_BASE64" | base64 --decode > "$ORANGE_KEYSTORE"
          trap 'rm -f "$ORANGE_KEYSTORE"' EXIT
          bash gradlew :hotel:assembleRelease :hotel:assembleReleaseAndroidTest -PupgradeFixture --no-daemon
          mkdir -p "$RUNNER_TEMP/candidate"
          cp hotel/build/outputs/apk/release/hotel-release.apk "$RUNNER_TEMP/candidate/Manzanilla-Reception.apk"
          mkdir -p "$RUNNER_TEMP/upgrade-fixture"
          cp hotel/build/outputs/apk/androidTest/release/hotel-release-androidTest.apk "$RUNNER_TEMP/upgrade-fixture/"
      - name: Check installed-release continuity and APK identity
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/previous"
          gh release download --repo "$GITHUB_REPOSITORY" --pattern '*.apk' --dir "$RUNNER_TEMP/previous"
          previous=("$RUNNER_TEMP/previous/"*.apk)
          test "${#previous[@]}" -eq 1
          python android/release_identity.py \
            --apk "$RUNNER_TEMP/candidate/Manzanilla-Reception.apk" \
            --previous-apk "${previous[0]}" --tag "$RELEASE_TAG" \
            --repository "$GITHUB_REPOSITORY" --output "$RUNNER_TEMP/candidate/release-metadata.json"
      - name: Enable emulator hardware acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Upgrade the previous signed release on Android 10
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          target: default
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: bash scripts/verify-signed-upgrade.sh
      - name: Retain signed upgrade evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: signed-upgrade-evidence
          path: work/signed-upgrade-qa/
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        with:
          name: orange-signed-pilot-apk
          path: ${{ runner.temp }}/candidate/*
          if-no-files-found: error
