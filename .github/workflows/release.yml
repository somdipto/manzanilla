name: Build verified signed APK
on:
  workflow_dispatch:
    inputs:
      keyed_pilot:
        description: Embed the Fish credential in this signed pilot APK only
        type: boolean
        required: false
        default: false
  workflow_call:
    inputs:
      keyed_pilot:
        description: Embed the Fish credential in this signed pilot APK only
        type: boolean
        required: false
        default: false
permissions:
  contents: read
jobs:
  verify:
    uses: ./.github/workflows/verify.yml
  signed-apk:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '17'}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - uses: android-actions/setup-android@v3
      - run: sdkmanager 'platforms;android-34' 'build-tools;34.0.0'
      - name: Read semantic publication identity
        shell: bash
        run: |
          set -euo pipefail
          version="$(tr -d '\r\n' < android/VERSION)"
          tag="v${version}"
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            test "$GITHUB_REF_NAME" = "$tag"
          fi
          printf 'RELEASE_TAG=%s\n' "$tag" >> "$GITHUB_ENV"
          printf '%s/build-tools/34.0.0\n' "$ANDROID_HOME" >> "$GITHUB_PATH"
      - name: Build with existing pilot signing key
        env:
          ORANGE_KEYSTORE_BASE64: ${{ secrets.ORANGE_KEYSTORE_BASE64 }}
          ORANGE_STORE_PASSWORD: ${{ secrets.ORANGE_STORE_PASSWORD }}
          ORANGE_KEY_ALIAS: ${{ secrets.ORANGE_KEY_ALIAS }}
          ORANGE_KEY_PASSWORD: ${{ secrets.ORANGE_KEY_PASSWORD }}
          ORANGE_KEYED_PILOT: ${{ inputs.keyed_pilot }}
          FISH_API_KEY: ${{ inputs.keyed_pilot && secrets.FISH_API_KEY || '' }}
          FISH_VOICE_ID: ${{ secrets.FISH_VOICE_ID }}
        working-directory: android
        shell: bash
        run: |
          set -euo pipefail
          test -n "$ORANGE_KEYSTORE_BASE64"
          if [[ "$ORANGE_KEYED_PILOT" == true && -z "$FISH_API_KEY" ]]; then
            echo "::error::The keyed pilot requires the FISH_API_KEY repository secret."
            exit 1
          fi
          export ORANGE_KEYSTORE="$RUNNER_TEMP/orange-pilot.jks"
          printf '%s' "$ORANGE_KEYSTORE_BASE64" | base64 --decode > "$ORANGE_KEYSTORE"
          trap 'rm -f "$ORANGE_KEYSTORE"' EXIT
          bash gradlew :hotel:assembleRelease --no-daemon
          mkdir -p "$RUNNER_TEMP/candidate"
          cp hotel/build/outputs/apk/release/hotel-release.apk "$RUNNER_TEMP/candidate/Manzanilla-Reception.apk"
      - name: Check installed-release continuity and APK identity
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/previous"
          gh release download --repo "$GITHUB_REPOSITORY" --pattern '*.apk' --dir "$RUNNER_TEMP/previous"
          previous=("$RUNNER_TEMP/previous/"*.apk)
          test "${#previous[@]}" -eq 1
          python android/release_identity.py \
            --apk "$RUNNER_TEMP/candidate/Manzanilla-Reception.apk" \
            --previous-apk "${previous[0]}" --tag "$RELEASE_TAG" \
            --repository "$GITHUB_REPOSITORY" --output "$RUNNER_TEMP/candidate/release-metadata.json"
      - uses: actions/upload-artifact@v4
        with:
          name: orange-signed-pilot-apk
          path: ${{ runner.temp }}/candidate/*
          if-no-files-found: error
