name: Build verified signed APK
# TEST BRANCH VARIANT: private diagnostics build. No embedded credentials, no
# publication, no identity/upgrade checks against the published release.
on:
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  test-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '17'}
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-34 build-tools;34.0.0'
      - name: Unit tests
        working-directory: android
        run: bash gradlew :hotel:testDebugUnitTest --no-daemon
      - name: Build signed test APK without embedded credentials
        env:
          ORANGE_KEYSTORE_BASE64: ${{ secrets.ORANGE_KEYSTORE_BASE64 }}
          ORANGE_STORE_PASSWORD: ${{ secrets.ORANGE_STORE_PASSWORD }}
          ORANGE_KEY_ALIAS: ${{ secrets.ORANGE_KEY_ALIAS }}
          ORANGE_KEY_PASSWORD: ${{ secrets.ORANGE_KEY_PASSWORD }}
        working-directory: android
        shell: bash
        run: |
          set -euo pipefail
          test -n "$ORANGE_KEYSTORE_BASE64"
          # This build must never carry an embedded voice credential.
          test -z "${FISH_API_KEY:-}"
          test -z "${FISH_VOICE_ID:-}"
          export ORANGE_KEYSTORE="$RUNNER_TEMP/orange-pilot.jks"
          printf '%s' "$ORANGE_KEYSTORE_BASE64" | base64 --decode > "$ORANGE_KEYSTORE"
          trap 'rm -f "$ORANGE_KEYSTORE"' EXIT
          bash gradlew :hotel:assembleRelease --no-daemon
          mkdir -p "$RUNNER_TEMP/candidate"
          cp hotel/build/outputs/apk/release/hotel-release.apk "$RUNNER_TEMP/candidate/Manzanilla-Reception-Test.apk"
      - name: Enable emulator hardware acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Screen-check the diagnostics activity on Android 10
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          target: default
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: bash scripts/screenshot-diagnostics.sh
      - uses: actions/upload-artifact@v4
        with:
          name: fish-diagnostics-test-apk
          path: ${{ runner.temp }}/candidate/*
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: diagnostics-screen-evidence
          path: work/diagnostics-screen/
          if-no-files-found: ignore
