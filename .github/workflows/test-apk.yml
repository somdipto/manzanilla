name: Build private Fish test APK
# Private test builds: no embedded credentials, no publication, no upgrade
# checks against the published release. Artifact download only.
on:
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  test-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '17'}
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-34 build-tools;34.0.0'
      - name: Unit tests
        working-directory: android
        run: bash gradlew :hotel:testDebugUnitTest --no-daemon
      - name: Build signed test APK without embedded credentials
        env:
          ORANGE_KEYSTORE_BASE64: ${{ secrets.ORANGE_KEYSTORE_BASE64 }}
          ORANGE_STORE_PASSWORD: ${{ secrets.ORANGE_STORE_PASSWORD }}
          ORANGE_KEY_ALIAS: ${{ secrets.ORANGE_KEY_ALIAS }}
          ORANGE_KEY_PASSWORD: ${{ secrets.ORANGE_KEY_PASSWORD }}
        working-directory: android
        shell: bash
        run: |
          set -euo pipefail
          test -n "$ORANGE_KEYSTORE_BASE64"
          # This build must never carry an embedded voice credential.
          test -z "${FISH_API_KEY:-}"
          test -z "${FISH_VOICE_ID:-}"
          export ORANGE_KEYSTORE="$RUNNER_TEMP/orange-pilot.jks"
          printf '%s' "$ORANGE_KEYSTORE_BASE64" | base64 --decode > "$ORANGE_KEYSTORE"
          trap 'rm -f "$ORANGE_KEYSTORE"' EXIT
          bash gradlew :hotel:assembleRelease --no-daemon
          mkdir -p "$RUNNER_TEMP/candidate"
          cp hotel/build/outputs/apk/release/hotel-release.apk "$RUNNER_TEMP/candidate/Manzanilla-Reception-Test.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: fish-diagnostics-test-apk
          path: ${{ runner.temp }}/candidate/*
          if-no-files-found: error
