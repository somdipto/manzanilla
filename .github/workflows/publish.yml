name: Publish verified Reception APK
on:
  push:
    tags: ['v*']
    branches: [main]
    paths:
      - 'android/**'
      - 'ui/reception/**'
      - 'package.json'
      - 'package-lock.json'
      - 'scripts/build-reception.cjs'
      - 'scripts/release_policy.py'
      - 'scripts/release_policy_check.py'
      - 'scripts/publish_release.py'
      - 'scripts/verify-signed-upgrade.sh'
      - 'scripts/run-updater-emulator.sh'
      - '.github/workflows/publish.yml'
      - '.github/workflows/release.yml'
      - '.github/workflows/verify.yml'
  workflow_dispatch: {}
permissions:
  contents: read
concurrency:
  group: reception-publication
  cancel-in-progress: false
jobs:
  policy:
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    outputs:
      published: ${{ steps.state.outputs.published }}
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Require a release version on merged app changes
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          BASE_SHA: ${{ github.event.before }}
        run: python scripts/release_policy.py --base "$BASE_SHA" --head "$GITHUB_SHA"
      - name: Detect an already complete publication of this exact commit
        id: state
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          tag="v$(tr -d '\r\n' < android/VERSION)"
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then test "$GITHUB_REF_NAME" = "$tag"; fi
          python scripts/publish_release.py --repository "$GITHUB_REPOSITORY" --tag "$tag" \
            --commit "$GITHUB_SHA" --check --github-output "$GITHUB_OUTPUT"
  candidate:
    needs: policy
    if: needs.policy.outputs.published != 'true'
    uses: ./.github/workflows/release.yml
    secrets: inherit
  publish:
    needs: [policy, candidate]
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-34 build-tools;34.0.0'
      - uses: actions/download-artifact@v4
        with:
          name: orange-signed-pilot-apk
          path: candidate
      - name: Recheck exact artifact and latest published APK before publication
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$ANDROID_HOME/build-tools/34.0.0:$PATH"
          version="$(tr -d '\r\n' < android/VERSION)"
          tag="v${version}"
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then test "$GITHUB_REF_NAME" = "$tag"; fi
          mkdir -p "$RUNNER_TEMP/previous"
          gh release download --repo "$GITHUB_REPOSITORY" --pattern '*.apk' --dir "$RUNNER_TEMP/previous"
          previous=("$RUNNER_TEMP/previous/"*.apk)
          test "${#previous[@]}" -eq 1
          python android/release_identity.py --apk candidate/Manzanilla-Reception.apk \
            --previous-apk "${previous[0]}" --tag "$tag" --repository "$GITHUB_REPOSITORY" \
            --output "$RUNNER_TEMP/rechecked-metadata.json"
          cmp candidate/release-metadata.json "$RUNNER_TEMP/rechecked-metadata.json"
          # Merge builds publish the already-verified candidate here. A tag made
          # with GITHUB_TOKEN does not trigger another workflow, so do not rely
          # on a second tag-push run to deliver the installed-app update.
          existing="$(git ls-remote --tags origin "refs/tags/$tag")"
          if [[ -n "$existing" ]]; then
            git fetch origin "refs/tags/$tag:refs/tags/$tag"
            test "$(git rev-parse "$tag^{commit}")" = "$GITHUB_SHA"
          else
            test "$GITHUB_REF" = refs/heads/main
            git tag "$tag" "$GITHUB_SHA"
            git push origin "refs/tags/$tag"
          fi
          printf 'RELEASE_TAG=%s\n' "$tag" >> "$GITHUB_ENV"
      - name: Publish the verified immutable release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          python scripts/publish_release.py --repository "$GITHUB_REPOSITORY" \
            --tag "$RELEASE_TAG" --commit "$GITHUB_SHA" --directory candidate
