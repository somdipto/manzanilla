name: Verify CDN update feed (fixture)
on:
  workflow_dispatch: {}
  push:
    branches: [test/fish-diagnostics]
    paths: ['.github/workflows/verify-cdn-update-feed.yml']
permissions:
  contents: read
jobs:
  fixture:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '17'}
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-34 build-tools;34.0.0'
      - name: Build the fixture 17.0.30 APK pointed at the fixture manifest
        env:
          ORANGE_KEYSTORE_BASE64: ${{ secrets.ORANGE_KEYSTORE_BASE64 }}
          ORANGE_STORE_PASSWORD: ${{ secrets.ORANGE_STORE_PASSWORD }}
          ORANGE_KEY_ALIAS: ${{ secrets.ORANGE_KEY_ALIAS }}
          ORANGE_KEY_PASSWORD: ${{ secrets.ORANGE_KEY_PASSWORD }}
        working-directory: android
        shell: bash
        run: |
          set -euo pipefail
          test -n "$ORANGE_KEYSTORE_BASE64"
          export ORANGE_KEYSTORE="$RUNNER_TEMP/orange-pilot.jks"
          printf '%s' "$ORANGE_KEYSTORE_BASE64" | base64 --decode > "$ORANGE_KEYSTORE"
          trap 'rm -f "$ORANGE_KEYSTORE"' EXIT
          bash gradlew :hotel:assembleRelease --no-daemon \
            -PfeedUrl="https://raw.githubusercontent.com/somdipto/manzanilla/test/fish-diagnostics/fixtures/update-feed/release-metadata.json" \
            -PlegacyFeedUrl="https://invalid.invalid/legacy-feed"
          cp hotel/build/outputs/apk/release/hotel-release.apk "$RUNNER_TEMP/fixture.apk"
      - name: Enable emulator hardware acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Observe CDN-manifest discovery
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          target: default
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: |
            # FIXTURE proof, not end-to-end: this 17.0.30 build's primary feed is a
            # fixture manifest and its legacy fallback is unreachable. Reaching the
            # download phase via the CDN manifest path (not a completed offer) is
            # the proof. The fixture's APK target intentionally does not exist.
            # Inline because this workflow checks out main, which lacks the script.
            # The runner executes this via /usr/bin/sh (dash): no pipefail, no bashisms.
            set -eu
            test "$(adb shell getprop ro.kernel.qemu | tr -d '\r')" = 1
            package=dev.orange.hotel
            evidence=work/cdn-update-feed
            mkdir -p "$evidence"
            if adb shell pm path "$package" | grep -q '^package:'; then
              echo 'Feed test requires a fresh disposable emulator' >&2
              exit 1
            fi
            adb install "$RUNNER_TEMP/fixture.apk" | tee "$evidence/install.txt"
            grep -q 'Success' "$evidence/install.txt"
            adb shell dumpsys package "$package" | grep -E 'versionCode|versionName' | head -2 | tee "$evidence/installed-version.txt"
            adb shell settings put secure immersive_mode_confirmations confirmed
            adb logcat -c
            adb shell am start -W -n "$package/com.agentdeck.hotel.HotelActivity" | tee "$evidence/launch.txt"
            grep -q 'Status: ok' "$evidence/launch.txt"
            stage="none"
            for round in $(seq 1 12); do
              sleep 10
              adb shell uiautomator dump /sdcard/ui.xml >/dev/null 2>&1 || true
              adb pull /sdcard/ui.xml "$evidence/ui-$round.xml" >/dev/null 2>&1 || true
              if [ -f "$evidence/ui-$round.xml" ]; then
                if grep -qE '17\.0\.31|ownloading' "$evidence/ui-$round.xml"; then stage="download-or-offer"; break; fi
                if grep -q 'Could not check for updates' "$evidence/ui-$round.xml"; then stage="check-failed"; break; fi
              fi
            done
            adb exec-out screencap -p > "$evidence/final.png" || true
            adb logcat -d -v threadtime > "$evidence/logcat.txt" || true
            {
              echo "stage reached: $stage"
              if grep -q 'Primary update feed failed' "$evidence/logcat.txt"; then
                echo 'UNEXPECTED: primary CDN manifest fetch failed (fallback would be unreachable)'
              else
                echo 'Primary CDN manifest fetch did not fail'
              fi
            } | tee "$evidence/result.txt"
            test "$stage" = "download-or-offer"
      - name: Retain CDN feed evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cdn-update-feed-evidence
          path: work/cdn-update-feed/
          if-no-files-found: error
