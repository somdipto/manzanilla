<section><h2 data-ui="Hotel knowledge and escalation configuration"></h2><p data-ui="Admin only. Enter the actual hotel ID, name, IANA timezone, staff-approved languages, contacts, services, knowledge and check-in policy. Empty fields mean unconfigured; no example hotel or policy is supplied. Reservation integration must be unconfigured, rest or edge. Credentials are issued separately."></p><p id="config-conflict" class="error" role="status"></p><button id="refresh-config" data-ui="Refresh configuration" disabled></button>

<label><span data-ui="Taxi mode"></span><select id="taxi-mode"><option value="staff_request" data-ui="Staff request"></option><option value="dialer" data-ui="Open phone app"></option></select></label><label><span data-ui="Reservation integration"></span><select id="connector"><option value="unconfigured" data-ui="Unconfigured"></option><option value="rest">REST</option><option value="edge" data-ui="Edge"></option></select></label></div>

<h3 data-ui="Knowledge"></h3><div id="knowledge-rows"></div><button id="add-knowledge" type="button" data-ui="Add"></button><p><button id="save" type="submit" data-ui="Save configuration"></button></p></fieldset></form></section>

}

function hotelTimestamp(value) {

function labelledInput(label,id,value,multiline=false) {

async function transition(item,draft) {

const configFields={name:'hotel-name',timezone:'timezone',default_language:'default-language',operator_primary:'operator-primary',operator_secondary:'operator-secondary',emergency_contact:'emergency-contact',taxi_number:'taxi-number',taxi_mode:'taxi-mode',connector:'connector',checkin_instructions:'arrival-policy'};

function renderLocale() {
  const focused=document.activeElement,focusId=focused&&focused.id,start=focused&&focused.selectionStart,end=focused&&focused.selectionEnd;
  document.documentElement.lang=locale;document.documentElement.dir=languages.get(locale).direction;document.title=uiText('Orange Reception');document.querySelectorAll('[data-ui]').forEach(node=>{node.textContent=uiText(node.dataset.ui)});$('staff-locale').value=locale;
  $('start').setAttribute('aria-label',uiText('Morning handoff'));$('end').setAttribute('aria-label',uiText('Morning handoff'));$('role').setAttribute('aria-label',uiText('Onboard device, Edge or staff'));
  $('inbox-filter').options[1].textContent=uiText('Waiting for reception')+' / '+uiText('Acknowledged');
  if(statusMessage)$('status').textContent=uiText(statusMessage,statusValues);renderInbox(true);renderPermissions();
  const arrival=reviewRows.findIndex(row=>row.kind==='arrival');if(arrival>=0)$('content-source').options[arrival].textContent=uiText('Arrival guide');renderReview();
  if(focusId&&$(focusId)&&$(focusId)!==focused){$(focusId).focus();if(start!==null&&typeof $(focusId).setSelectionRange==='function')$(focusId).setSelectionRange(start,end)}
}
function stopPolling(){clearTimeout(pollTimer);pollTimer=null;if(overviewFlight)overviewFlight.controller.abort()}
function schedulePoll(){clearTimeout(pollTimer);if(!document.hidden&&loadedHotel&&loadedHotel===$('hotel').value)pollTimer=setTimeout(()=>load().catch(showError),5000)}
function renderInboxPages(){
  $('inbox-page').textContent=String(inboxPages.length+1);
  $('inbox-back').disabled=!loadedHotel||!!overviewFlight||!inboxPages.length;
  $('inbox-next').disabled=!loadedHotel||!!overviewFlight||!inboxNext;
}
function navigateInbox(before,pages) {
  stopPolling();overviewFlight=null;pageRevision++;inboxBefore=before;inboxPages=pages;inboxNext=null;
  load().catch(showError);
}
async function load() {
  if(overviewFlight)return overviewFlight.promise;
  const current=scope(),page=pageRevision,controller=new AbortController(),flight={controller,promise:null};overviewFlight=flight;renderInboxPages();
  const parameters=new URLSearchParams();if($('inbox-filter').value!=='all')parameters.set('item_status',$('inbox-filter').value);if(inboxBefore)parameters.set('before',inboxBefore);
  flight.promise=(async()=>{try {
    const data=await api('/api/hotels/'+hid()+'/overview'+(parameters.size?'?'+parameters:''),'GET',undefined,controller.signal);if(current!==scope()||page!==pageRevision)return;
    inboxNext=data.items_next||null;
    const changed=loadedHotel!==$('hotel').value;loadedHotel=$('hotel').value;
    if(changed){items=[];drafts.clear();dirty=false;configConflict=false;localeSelected=false;$('inbox').replaceChildren()}
    // A delayed overview must never replace a newer item or configuration.
    const previous=new Map(items.map(item=>[item.id,item]));items=data.items.map(item=>previous.has(item.id)&&previous.get(item.id).state_version>item.state_version?previous.get(item.id):item);
    if(!hotelConfig||data.hotel.config_version>=hotelConfig.config_version)hotelConfig=data.hotel;
    principal=data.principal;contentAdmin=data.content_admin===true;
    if(!dirty&&!configConflict&&(!formBase||formBase.config_version!==hotelConfig.config_version))fillConfiguration(hotelConfig);
    if(!localeSelected)locale=languages.has(hotelConfig.default_language)?hotelConfig.default_language:'es';
    updateReview(data.content_review||[],contentAdmin,changed);$('fleet').textContent=JSON.stringify({devices:data.devices,integrations:data.integrations},null,2);$('sessions').textContent=JSON.stringify(data.sessions,null,2);
    renderLocaleFromPoll();
  } finally {if(overviewFlight===flight){overviewFlight=null;renderInboxPages();if(current===scope())schedulePoll()}}})();
  return flight.promise;
}
function renderLocaleFromPoll(){
  const changed=document.documentElement.lang!==locale;if(changed)renderLocale();else{renderInbox();renderPermissions();renderReview()}
}
function resetScope(){
  scopeRevision++;stopPolling();overviewFlight=null;saveBusy=false;loadedHotel='';hotelConfig=null;formBase=null;items=[];drafts.clear();dirty=false;configConflict=false;principal=null;contentAdmin=false;contentBusy=false;review=null;reviewRows=[];reviewMessage='';
  pageRevision++;inboxBefore='';inboxPages=[];inboxNext=null;$('inbox-filter').value='all';renderInboxPages();
  for(const id of ['inbox','fleet','sessions','credential','summary','hotel-list','timezone-warning','handoff-timezone'])$(id).replaceChildren();$('content-source').replaceChildren();$('content-title').value='';$('content-body').value='';renderPermissions();renderReview();
}
for(const language of catalogue.languages){const option=element('option',language.native);option.value=language.code;option.lang=language.code;option.dir=language.direction;for(const id of ['staff-locale','content-language','default-language','supported-languages'])$(id).append(option.cloneNode(true))}
const blank=element('option','');blank.value='';$('default-language').prepend(blank);$('default-language').value='';
$('staff-locale').onchange=()=>{if(languages.has($('staff-locale').value)){locale=$('staff-locale').value;localeSelected=true;renderLocale()}};
$('configuration').addEventListener('input',()=>{dirty=true});$('configuration').addEventListener('change',()=>{dirty=true});
$('add-service').onclick=()=>{dictionaryRow('services');dirty=true};$('add-knowledge').onclick=()=>{dictionaryRow('knowledge');dirty=true};
$('content-source').onchange=()=>selectReview();$('content-language').onchange=()=>selectReview();$('content-draft').onclick=()=>submitReview(true);$('content-approve').onclick=()=>submitReview(false);
$('inbox-filter').onchange=()=>navigateInbox('',[]);
$('inbox-back').onclick=()=>{if(inboxPages.length)navigateInbox(inboxPages[inboxPages.length-1],inboxPages.slice(0,-1))};
$('inbox-next').onclick=()=>{if(inboxNext)navigateInbox(inboxNext,[...inboxPages,inboxBefore])};
for(const id of ['token','hotel'])$(id).addEventListener('input',resetScope);
document.addEventListener('visibilitychange',()=>{if(document.hidden)stopPolling();else if(loadedHotel)load().catch(showError)});window.addEventListener('pagehide',stopPolling);
action('load',load);
action('list',async()=>{const current=scope(),hotels=await api('/api/hotels');if(current!==scope())return;$('hotel-list').replaceChildren();for(const hotel of hotels){const button=element('button',hotel.name+' ('+hotel.id+')');button.onclick=()=>{$('hotel').value=hotel.id;resetScope();load().catch(showError)};$('hotel-list').append(button)}});
action('create',async()=>{const current=scope();if(!/^[a-zA-Z0-9_-]{1,64}$/.test($('hotel').value))fail('Please complete these details.');const hotels=await api('/api/hotels');if(current!==scope())return;if(hotels.some(hotel=>hotel.id===$('hotel').value))fail('Configuration changed. Your edits are kept. Refresh and review before saving again.');contentAdmin=true;principal={role:'admin',id:'admin',hotel:$('hotel').value};fillConfiguration({id:$('hotel').value,name:'',timezone:'',default_language:'',supported_languages:[],operator_primary:'',operator_secondary:'',emergency_contact:'',taxi_number:'',taxi_mode:'staff_request',checkin_instructions:'',services:{},knowledge:{},connector:'unconfigured',config_version:1});dirty=true;renderPermissions()});
$('configuration').onsubmit=async event=>{
  event.preventDefault();if(saveBusy||configConflict)return;const current=scope();let config;
  try{config=configuration()}catch(error){showError(error);return}saveBusy=true;renderPermissions();
  try{const saved=await api('/api/hotels/'+hid(),'PUT',config);if(current!==scope())return;hotelConfig=saved;fillConfiguration(saved);await load();message('Updated')}
  catch(error){if(current!==scope())return;if(error.status===409){configConflict=true;message('Configuration changed. Your edits are kept. Refresh and review before saving again.')}else showError(error)}
  finally{if(current===scope()){saveBusy=false;renderPermissions()}}
};
action('refresh-config',async()=>{if(dirty&&!confirm(uiText('Refreshing replaces your unsaved configuration edits. Continue?')))return;const current=scope();await load();if(current===scope()&&hotelConfig)fillConfiguration(hotelConfig)});
action('issue',async()=>{if(!contentAdmin)fail('Hotel authorization required');const current=scope(),result=await api('/api/hotels/'+hid()+'/credentials','POST',{role:$('role').value});if(current===scope())$('credential').textContent=JSON.stringify(result,null,2)});
action('morning',async()=>{const current=scope(),start=hotelTimestamp($('start').value),end=hotelTimestamp($('end').value);if(end<=start)fail('Please complete these details.');const result=await api('/api/hotels/'+hid()+'/morning?start='+start+'&end='+end);if(current===scope())$('summary').textContent=JSON.stringify(result,null,2)});
renderLocale();
})();
</script></html>
