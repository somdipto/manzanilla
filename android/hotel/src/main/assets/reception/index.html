<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="dark">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'none'; media-src 'none'; object-src 'none'; base-uri 'none'">
  <title>Manzanilla reception</title>
  <link rel="stylesheet" href="reception.css">
</head>
<body>
  <div class="aurora" aria-hidden="true"><svg viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice"><defs><linearGradient id="aurora-color" x1="0" y1="1" x2=".85" y2="0"><stop stop-color="#0c263c" stop-opacity="0"/><stop offset=".26" stop-color="#155274" stop-opacity=".5"/><stop offset=".47" stop-color="#379bbd"/><stop offset=".61" stop-color="#b1dfdc"/><stop offset=".7" stop-color="#eee5bc"/><stop offset=".8" stop-color="#85cddd"/><stop offset="1" stop-color="#23628f" stop-opacity=".35"/></linearGradient><filter id="aurora-soft" x="-30%" y="-60%" width="160%" height="220%"><feGaussianBlur stdDeviation="24"/></filter></defs><path d="M-160 730C240 710 430 565 600 410 760 264 850 105 1025 147 1240 198 1180 485 1445 408 1540 380 1630 280 1740 245L1755 580C1580 728 1310 703 1130 500 1020 374 973 281 855 376 610 572 413 765-160 730Z" fill="url(#aurora-color)" filter="url(#aurora-soft)" opacity=".94"/></svg><div class="aurora-shade"></div></div>
  <div class="app">
    <header class="topbar">
      <div class="wordmark"><svg viewBox="0 0 32 32" width="27" height="27" aria-hidden="true"><path d="M6 3h12a11 11 0 0 1 11 11v12L17 15l7 14H13A10 10 0 0 1 3 19V6a3 3 0 0 1 3-3Z" fill="currentColor"/></svg><span>Manzanilla<span class="brand-sub" id="mode-title">Reception</span></span></div>
      <div class="clock" aria-label="Local date and time"><span id="date"></span><time id="time"></time></div>
      <button id="night-toggle" class="night-toggle" aria-pressed="false">Night reception</button>
      <div id="connection" class="connection" hidden><span class="status-dot"></span><span id="connection-text"></span></div>
      <button class="icon-button" id="settings" aria-label="Staff setup" title="Staff setup"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><path d="m9 3-.7 2.6-2.5 1L3.5 6 2 8.6l1.9 1.9v3L2 15.4 3.5 18l2.3-.6 2.5 1L9 21h6l.7-2.6 2.5-1 2.3.6 1.5-2.6-1.9-1.9v-3L22 8.6 20.5 6l-2.3.6-2.5-1L15 3Z"/><circle cx="12" cy="12" r="3"/></svg></button>
    </header>
    <section id="notices" class="service-notices" aria-label="Hotel service updates" aria-live="polite" hidden></section>
    <main class="glass-desk" id="desk">
      <section class="content" id="content" aria-live="polite"></section>
    </main>
    <footer class="footer"><span id="privacy" role="status" aria-live="polite"></span><button id="check-updates" class="update-check" type="button">Check updates</button><span id="hotel-label"></span><span id="hardware-hint"></span></footer>
  </div>
  <div class="toast" id="toast" role="status" hidden></div>
  <script src="greetings.js" defer></script>
  <script src="language-turns.js" defer></script>
  <script src="reception.js" defer></script>
</body>
</html>
